<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olympe sans framework</title>
<link rel="stylesheet" href="olympe.css">
<link rel="icon" href="../public/assets/favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../public/assets/favicon/favicon-32.png">
<style>
  .shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
  .m-sidebar { position: sticky; top: 0; height: 100vh; box-sizing: border-box; }
  .nav { display: flex; flex-direction: column; gap: 1px; }
  .main { padding: 24px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .row2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; }
  .row2b { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .theme-bar { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-bottom: -6px; }
  .foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
  @media (max-width: 900px) { .shell { grid-template-columns: 1fr; } .m-sidebar { display: none; } .row2, .row2b { grid-template-columns: 1fr; } }
</style>
</head>
<body class="m-body">
<div class="shell">
  <aside class="m-sidebar">
    <div class="m-sb-ws"><span class="m-sb-mark"><img class="m-mark-ink" src="../public/assets/meridiem-icone.png" alt=""></span><div><b>Command Center</b><small>Meridiem</small></div></div>
    <div class="m-sb-search" onclick="pal.open()"><i data-icon="Search01"></i>Rechercher<span class="m-kbd">⌘K</span></div>
    <nav class="nav" id="nav">
      <div class="m-nav-label">Pilotage</div>
      <a class="m-nav-item is-active"><i data-icon="DashboardSquare01"></i>Tableau de bord</a>
      <a class="m-nav-item"><i data-icon="Kanban"></i>Tâches<span class="m-count">8</span></a>
      <a class="m-nav-item"><i data-icon="Message01"></i>Messages<span class="m-count">3</span></a>
      <div class="m-nav-label">Commercial</div>
      <a class="m-nav-item"><i data-icon="Analytics01"></i>CRM<span class="m-count">9</span></a>
      <a class="m-nav-item"><i data-icon="Folder01"></i>Projets</a>
    </nav>
    <div class="m-nav-label">À valider</div>
    <div class="m-sb-mini"><span>Relances devis de septembre</span><span class="m-tag">à valider</span></div>
    <div class="m-sb-mini"><span>Réclamation commande 4512</span><span class="m-tag is-crit">urgent</span></div>
    <div class="foot">
      <div class="m-sb-system"><span class="m-badge is-ok">Taskrunner</span><span class="m-badge is-ok">Opérateur</span></div>
      <div class="m-sb-user">
        <button class="m-sb-userbtn" id="userbtn"><span class="m-avatar">MS</span><span style="min-width:0"><b>Maxime Schifflers</b><small>maxime@meridiem.be</small></span><i data-icon="UnfoldMore" style="margin-left:auto;color:var(--m-muted-fg)"></i></button>
        <div id="usermenu">
          <div class="m-menu-head"><span class="m-avatar">MS</span><div><b style="font-weight:500">Maxime Schifflers</b><div class="m-muted" style="font-size:12px">Meridiem</div></div></div>
          <button class="m-menu-item" onclick="dlg.open()"><i data-icon="Settings02"></i>Réglages</button>
          <button class="m-menu-item" onclick="MUI.toast('Aide')"><i data-icon="HelpCircle"></i>Aide</button>
          <div class="m-menu-sep"></div>
          <button class="m-menu-item is-danger" onclick="MUI.toast('Déconnexion', { description: 'Désactivée dans la démo' })"><i data-icon="Logout01"></i>Se déconnecter</button>
        </div>
      </div>
    </div>
  </aside>
  <main class="main m-stagger" id="main"></main>
</div>
<script src="icons.js"></script>
<script src="art.js"></script>
<script src="meridiem.js"></script>
<script>
  MUI.citySrc = "../public/assets/ville-europe.jpg";
  var main = document.getElementById("main");
  main.innerHTML =
    '<div class="theme-bar"><span class="m-eyebrow">Thème</span><div class="m-tabs" role="tablist" aria-label="Thème" id="theme"><button type="button" data-t="light">Jour</button><button type="button" data-t="dark">Nuit</button><button type="button" data-t="auto">Système</button></div></div>' +
    MUI.banner({ eyebrow: "Bonjour Maxime", title: "Votre journée", sub: "lundi 5 octobre · 12 choses à valider · 2 agents actifs", actions: '<button class="m-btn m-btn-primary m-btn-sm" onclick="MUI.toast(\'Ouverture des tâches\', { tone: \'ok\' })">Traiter les demandes</button><button class="m-btn m-btn-ghost m-btn-sm">Voir le CRM</button>' }) +
    '<div class="m-kpis">' +
      MUI.kpi({ label: "Besoin de toi", value: "12", note: "8 tâches · 4 retards", kind: "bars" }) +
      MUI.kpi({ label: "Pipeline en jeu · 12 mois", value: "184 k€", note: "27 affaires ouvertes", kind: "line" }) +
      MUI.kpi({ label: "Gagné · 12 mois", value: "96 k€", note: "14 affaires gagnées", kind: "rings" }) +
      MUI.kpi({ label: "Activité des agents", value: "2", note: "2 tâches en cours", kind: "cubes" }) +
    "</div>" +
    '<div class="row2"><div class="m-card"><div class="m-card-head"><div><h3 class="m-card-title">Activité, 14 derniers jours</h3><p class="m-card-desc">tâches créées et clôturées</p></div></div><div class="m-card-body"><div id="area"></div></div></div>' +
    '<div class="m-card"><div class="m-card-head"><div><h3 class="m-card-title">Qualité</h3><p class="m-card-desc">correctifs acceptés</p></div></div><div class="m-card-body" style="display:flex;justify-content:center"><div id="radial"></div></div></div></div>' +
    '<div class="row2b"><div class="m-card"><div class="m-card-head"><div><h3 class="m-card-title">Tâches par statut</h3><p class="m-card-desc">sur 30 jours</p></div></div><div class="m-card-body"><div id="cols"></div></div></div>' +
    '<div class="m-card"><div class="m-card-head"><div><h3 class="m-card-title">Répartition du pipeline</h3><p class="m-card-desc">montants one-shot</p></div></div><div class="m-card-body"><div id="donut"></div></div></div></div>' +
    '<div class="m-card" style="padding:18px 20px"><h3 class="m-card-title">Relances devis de septembre</h3><p class="m-card-desc">4 brouillons prêts, rien ne part sans toi.</p>' +
      MUI.actionBar({ prompt: "L'agent attend ta décision", decision: [{ label: "Confirmer", icon: "Tick02", kind: "primary", onclick: "MUI.toast('Confirmé, l\\'agent reprend', { tone: 'ok' })" }, { label: "Donner un retour", icon: "PencilEdit02" }],
        follow: [{ label: "Marquer lu", icon: "MailOpen01" }], more: [{ label: "Discuter avec l'agent", icon: "Message01" }, { label: "C'est réglé", icon: "CheckmarkCircle02" }] }) + "</div>" +
    '<div class="m-card">' + MUI.empty({ icon: "CheckList", title: "Rien d'autre en attente", text: "Les tâches terminées apparaissent ici.", action: '<button class="m-btn m-btn-sm">Voir l\'historique</button>' }) + "</div>" +
    MUI.ctaBand({ title: "Tout tourne.", text: "12 contrôles au vert, contrôlé à 09:30.", action: '<button class="m-btn m-btn-primary m-btn-sm">Voir la santé</button>' });
  var labels = [], cr = [], cl = [];
  for (var i = 13; i >= 0; i--) { var d = new Date(Date.now() - i * 864e5); labels.push(d.toLocaleDateString("fr-BE", { day: "numeric", month: "short" })); cr.push(Math.round(8 + 8 * Math.abs(Math.sin(i / 2)))); cl.push(Math.round(6 + 7 * Math.abs(Math.sin(i / 2 + 0.6)))); }
  MUI.area(document.getElementById("area"), { labels: labels, series: [{ name: "Créées", values: cr, color: MUI.CHART[1] }, { name: "Clôturées", values: cl, color: MUI.CHART[0] }] });
  MUI.radial(document.getElementById("radial"), { value: 67, sub: "objectif : 70 %" });
  MUI.columns(document.getElementById("cols"), { name: "Tâches", data: [{ label: "À faire", value: 12 }, { label: "En cours", value: 4 }, { label: "Besoin de moi", value: 15 }, { label: "Terminées", value: 41 }] });
  MUI.donut(document.getElementById("donut"), { total: "184 k€", sub: "pipeline actif", format: function (v) { return Math.round(v / 1000) + " k€"; }, segments: [{ label: "Découverte", value: 52000 }, { label: "Offre et négociation", value: 88000 }, { label: "Gagné", value: 44000 }] });
  MUI.bind(document);
  MUI.navPill(document.getElementById("nav"));
  var pal = MUI.palette({ placeholder: "Rechercher une page ou une action", hotkey: true, items: [
    { group: "Pages", label: "Tableau de bord", icon: "DashboardSquare01" }, { group: "Pages", label: "Tâches", icon: "Kanban", hint: "26" },
    { group: "Pages", label: "Messages", icon: "Message01" }, { group: "Pages", label: "CRM", icon: "Analytics01" }, { group: "Pages", label: "Projets", icon: "Folder01" },
    { group: "Actions", label: "Nouvelle tâche", icon: "Add01", run: function () { MUI.toast("Nouvelle tâche", { description: "Formulaire (démo)" }); } } ],
    sources: [{ group: "Tâches", items: [{ label: "Relancer le devis Verrerie Delvaux", sub: "À faire", icon: "Task01", badge: MUI.badge("wait", "à valider") },
      { label: "Préparer la réunion Biscuiterie Destrée", sub: "En cours", icon: "Task01", badge: MUI.badge("info", "en cours") }] }],
    emptyText: function (q) { return "Aucun résultat pour « " + q + " »"; },
    emptyItems: function () { return [{ group: "Suggestion", label: "Nouvelle tâche", icon: "Add01" }]; } });
  var dlg = MUI.dialog({ title: "Réglages", content: '<div class="m-section"><p class="m-section-t">Confidentialité</p><label class="m-setting"><span><span class="m-setting-t">Masquer les montants</span><span class="m-setting-d">Floute les montants à l\'écran.</span></span><input type="checkbox" class="m-switch"></label></div>' });
  MUI.menu(document.getElementById("userbtn"), document.getElementById("usermenu"), { side: "top" });
  // Jour, nuit ou réglage du système : choix gardé dans ce navigateur (démo)
  var themeBtns = document.querySelectorAll("#theme button");
  function markTheme() { var t = document.documentElement.getAttribute("data-theme") || "light"; themeBtns.forEach(function (b) { b.setAttribute("aria-selected", b.getAttribute("data-t") === t ? "true" : "false"); }); }
  try { var saved = localStorage.getItem("olympe-theme"); if (saved) MUI.setTheme(saved); } catch (e) { /* stockage indisponible */ }
  markTheme();
  themeBtns.forEach(function (b) { b.addEventListener("click", function () {
    var t = b.getAttribute("data-t"); MUI.setTheme(t); markTheme();
    try { localStorage.setItem("olympe-theme", t); } catch (e) { /* stockage indisponible */ }
    MUI.toast(t === "dark" ? "Mode nuit" : t === "auto" ? "Thème du système" : "Mode jour", { description: "Thème actif : " + (MUI.theme() === "dark" ? "nuit" : "jour") });
  }); });
  document.querySelectorAll("#nav .m-nav-item").forEach(function (a) { a.addEventListener("click", function () { document.querySelectorAll("#nav .m-nav-item").forEach(function (x) { x.classList.toggle("is-active", x === a); }); main.classList.remove("m-view-in"); void main.offsetWidth; main.classList.add("m-view-in"); }); });
</script>
</body>
</html>
